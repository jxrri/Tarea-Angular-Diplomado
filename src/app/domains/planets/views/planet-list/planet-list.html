<h2 class="mb-6 text-3xl font-black tracking-tight text-stone-900">Planetas</h2>

@if (loading()) {
  <p class="text-stone-500">Cargando…</p>
} @else {
  <p class="mb-4 text-sm text-stone-500">{{ total() }} resultados · página {{ page() }} de {{ pageCount() }}</p>

  <section class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mb-6">
    @for (planet of planets(); track planet.id) {
      <app-planet-card [planet]="planet" />
    } @empty {
      <p class="col-span-full text-stone-500">No hay planetas registrados.</p>
    }
  </section>

  <app-pager [page]="page()" [pageCount]="pageCount()" (changed)="page.set($event)" />
}
